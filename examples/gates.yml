name: content gates
on: [pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npx gates --fail-on warn
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gates-report, path: .gates/ }
